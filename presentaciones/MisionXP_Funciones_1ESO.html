<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión XP — Funciones y Proporcionalidad</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap');

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --void:    #08080F;
  --dark:    #0D0D1A;
  --dark2:   #14142B;
  --dark3:   #1E1E3A;
  --cyan:    #00FFFF;
  --cyan2:   #00BFFF;
  --purple:  #AA00FF;
  --purple2: #7B00CC;
  --gold:    #FFD700;
  --gold2:   #FFA500;
  --green:   #00FF88;
  --green2:  #00CC66;
  --red:     #FF4444;
  --white:   #E8E8FF;
  --muted:   #4A4A7A;
  --c1: #00FFFF;
  --c2: #AA00FF;
  --c3: #FF6600;
  --c4: #00FF88;
  --c5: #FF44AA;
}

html, body { width:100%; height:100%; background:#000; overflow:hidden; cursor:pointer; }

#stage {
  position:absolute; width:1280px; height:720px;
  transform-origin:0 0; overflow:hidden;
  font-family:'VT323', monospace;
  image-rendering: pixelated;
}

/* ── PIXEL STARFIELD ── */
.rpg-bg {
  position:absolute; inset:0;
  background:var(--void);
  background-image:
    radial-gradient(1px 1px at 8%  12%, rgba(0,255,255,.8)  0%, transparent 100%),
    radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 42% 8%,  rgba(170,0,255,.6)  0%, transparent 100%),
    radial-gradient(1px 1px at 60% 35%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 78% 68%, rgba(0,255,136,.6)  0%, transparent 100%),
    radial-gradient(2px 2px at 90% 22%, rgba(0,255,255,.5)  0%, transparent 100%),
    radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 92%, rgba(170,0,255,.5)  0%, transparent 100%),
    radial-gradient(1px 1px at 55% 72%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(2px 2px at 72% 88%, rgba(255,215,0,.4)  0%, transparent 100%),
    radial-gradient(1px 1px at 88% 52%, rgba(0,255,255,.7)  0%, transparent 100%),
    radial-gradient(1px 1px at 5%  55%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 48% 55%, rgba(170,0,255,.4)  0%, transparent 100%),
    radial-gradient(1px 1px at 95% 78%, rgba(0,255,136,.5)  0%, transparent 100%);
}
/* Scanline overlay */
.rpg-bg::after {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);
  pointer-events:none;
}

/* Grid floor effect */
.grid-floor {
  position:absolute; bottom:0; left:0; right:0; height:220px;
  background:
    linear-gradient(rgba(0,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,.04) 1px, transparent 1px);
  background-size:60px 60px;
  transform:perspective(400px) rotateX(50deg);
  transform-origin:bottom center;
  opacity:.6;
}

/* ── SLIDES ── */
.slide { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
.slide.active { opacity:1; pointer-events:all; }

/* ── PIXEL BORDER ── */
.pixel-border {
  position:absolute; inset:16px;
  border:3px solid var(--cyan);
  box-shadow:0 0 0 6px var(--void), 0 0 0 8px var(--cyan2), 0 0 30px rgba(0,255,255,.4);
  pointer-events:none; z-index:2;
}
.pixel-border::before {
  content:'';
  position:absolute; inset:4px;
  border:1px solid rgba(0,255,255,.2);
}

/* ── XP TRACKER ── */
.tracker {
  position:absolute; top:0; left:0; right:0; height:62px;
  background:rgba(8,8,15,.97);
  border-bottom:2px solid rgba(0,255,255,.3);
  display:flex; align-items:center; justify-content:center;
  gap:8px; padding:0 16px; z-index:10;
}
.level-btn {
  width:134px; height:48px;
  border:2px solid rgba(74,74,122,.5);
  background:rgba(13,13,26,.8);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; transition:all .4s; border-radius:2px;
  position:relative; overflow:hidden;
}
.level-btn::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:3px;
  background:var(--cyan); transform:scaleX(0); transform-origin:left;
  transition:transform .4s;
}
.level-btn.active::after { transform:scaleX(1); }
.level-btn.done::after   { transform:scaleX(1); background:var(--green); }
.level-btn.active { background:rgba(0,255,255,.12); border-color:var(--cyan); box-shadow:0 0 14px rgba(0,255,255,.35); }
.level-btn.done   { background:rgba(0,255,136,.1); border-color:var(--green2); }
.lv-num   { font-family:'Press Start 2P',monospace; font-size:10px; color:var(--muted); }
.level-btn.active .lv-num { color:var(--cyan); }
.level-btn.done   .lv-num { color:var(--green); }
.lv-label { font-size:10px; color:rgba(74,74,122,.8); letter-spacing:1px; }
.level-btn.active .lv-label,
.level-btn.done   .lv-label { color:rgba(232,232,255,.7); }

/* ── HUD PANELS ── */
.rpg-panel {
  background:rgba(13,13,26,.88);
  border:2px solid rgba(0,255,255,.35);
  box-shadow:0 0 20px rgba(0,255,255,.1), inset 0 0 30px rgba(0,0,0,.4);
  position:relative;
}
.rpg-panel::before {
  content:attr(data-label);
  position:absolute; top:-11px; left:14px;
  background:var(--dark); color:var(--cyan2);
  font-size:10px; letter-spacing:3px; padding:0 8px;
  font-family:'Share Tech Mono',monospace;
}
.rpg-panel-gold {
  background:rgba(20,16,0,.88);
  border:2px solid rgba(255,215,0,.5);
  box-shadow:0 0 20px rgba(255,215,0,.15);
}
.rpg-panel-green {
  background:rgba(0,20,12,.88);
  border:2px solid var(--green2);
  box-shadow:0 0 25px rgba(0,255,136,.2);
}
.rpg-panel-purple {
  background:rgba(15,0,28,.88);
  border:2px solid rgba(170,0,255,.5);
  box-shadow:0 0 18px rgba(170,0,255,.2);
}

/* ── XP BAR ── */
.xp-track { height:8px; background:rgba(0,255,255,.1); border:1px solid rgba(0,255,255,.2); border-radius:1px; overflow:hidden; }
.xp-fill  { height:100%; background:linear-gradient(90deg,var(--cyan2),var(--cyan)); box-shadow:0 0 8px rgba(0,255,255,.6); transition:width .8s ease; }

/* ── LEVEL BAND ── */
.level-band {
  position:absolute; left:26px; right:26px; height:28px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; letter-spacing:3px; color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  border-top:1px solid rgba(0,255,255,.1);
  border-bottom:1px solid rgba(0,255,255,.1);
}

/* ── GRAPH SVG ── */
.graph-container {
  background:rgba(0,0,0,.5);
  border:1.5px solid rgba(0,255,255,.25);
}

/* ── BADGES ── */
.badge {
  display:inline-flex; align-items:center; justify-content:center;
  padding:4px 12px; font-size:10px; letter-spacing:2px;
  font-family:'Share Tech Mono',monospace;
}
.badge-cyan   { background:rgba(0,255,255,.12); color:var(--cyan); border:1px solid rgba(0,255,255,.4); }
.badge-green  { background:rgba(0,255,136,.12); color:var(--green); border:1px solid var(--green2); }
.badge-gold   { background:rgba(255,215,0,.12); color:var(--gold); border:1px solid rgba(255,215,0,.4); }
.badge-purple { background:rgba(170,0,255,.15); color:#CC88FF; border:1px solid rgba(170,0,255,.4); }

/* ── FORMULA BOX ── */
.formula-box {
  background:rgba(0,0,8,.7);
  border:2px solid var(--gold);
  box-shadow:0 0 18px rgba(255,215,0,.25);
  padding:12px 24px;
  text-align:center;
  display:inline-block;
}

/* ── ANIMATIONS ── */
@keyframes pulse-cyan  { 0%,100%{box-shadow:0 0 20px rgba(0,255,255,.3)} 50%{box-shadow:0 0 50px rgba(0,255,255,.7)} }
@keyframes pulse-green { 0%,100%{box-shadow:0 0 20px rgba(0,255,136,.3)} 50%{box-shadow:0 0 50px rgba(0,255,136,.7)} }
@keyframes level-up    { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
@keyframes blink-cursor{ 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes float-sprite{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes slide-in-rpg{
  from{opacity:0; transform:translateY(20px)}
  to  {opacity:1; transform:translateY(0)}
}
.slide.active > * { animation:slide-in-rpg .3s ease-out; }
.float-anim { animation:float-sprite 2s ease-in-out infinite; }
.blink      { animation:blink-cursor 1s step-end infinite; }

/* ── NAV BAR ── */
#nav-bar {
  position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px;
  background:rgba(8,8,15,.95); border:2px solid rgba(0,255,255,.3);
  padding:5px 14px; z-index:9999; border-radius:2px;
  opacity:0; transition:opacity .3s;
  box-shadow:0 4px 20px rgba(0,0,0,.9), 0 0 20px rgba(0,255,255,.1);
}
#nav-bar:hover, body:hover #nav-bar { opacity:1; }
.nav-btn {
  background:none; border:none; cursor:pointer;
  color:var(--cyan); font-size:14px; padding:4px 8px;
  font-family:'Share Tech Mono',monospace; transition:color .2s;
}
.nav-btn:hover { color:var(--white); }
#slide-counter { color:var(--muted); font-size:10px; font-family:'Share Tech Mono',monospace; min-width:60px; text-align:center; }
.nav-sep { width:1px; height:16px; background:rgba(0,255,255,.2); }
#btn-voice.speaking { color:var(--green); text-shadow:0 0 8px var(--green); }
#btn-voice.muted    { color:var(--muted); }
#voice-speed { background:none; border:1px solid rgba(0,255,255,.2); color:var(--muted); font-size:9px; font-family:'Share Tech Mono',monospace; padding:2px 6px; cursor:pointer; outline:none; border-radius:2px; }
#voice-speed option { background:var(--dark); }
#progress-line { position:fixed; bottom:0; left:0; height:2px; background:linear-gradient(90deg,var(--purple),var(--cyan)); transition:width .4s ease; z-index:9998; }
#speak-bar { position:fixed; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--cyan2),var(--cyan),var(--cyan2)); background-size:200% 100%; animation:speak-wave 1s linear infinite; z-index:9997; display:none; }
@keyframes speak-wave { from{background-position:0%} to{background-position:200%} }
#click-hint { position:absolute; bottom:18px; left:0; right:0; text-align:center; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--muted); z-index:6; }
</style>
</head>
<body>
<div id="speak-bar"></div>
<div id="stage"></div>
<div id="nav-bar">
  <button class="nav-btn" id="btnPrev">◄</button>
  <span id="slide-counter">1 / 1</span>
  <button class="nav-btn" id="btnNext">►</button>
  <div class="nav-sep"></div>
  <button class="nav-btn" id="btn-voice" title="Narrador (M)">🔊</button>
  <select id="voice-speed"><option value="0.7">LENTO</option><option value="0.85" selected>NORMAL</option><option value="1.1">RÁPIDO</option></select>
  <div class="nav-sep"></div>
  <button class="nav-btn" id="btn-music" title="Música 8-bit (N)">🎵</button>
  <div class="nav-sep"></div>
  <button class="nav-btn" id="btn-fs">⛶</button>
</div>
<div id="progress-line"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// GRAPH HELPER
// ═══════════════════════════════════════════════════════════════
function graphSVG({points=[], line=null, xMax=6, yMax=12, w=260, h=220, color='#00FFFF', label='', xLabel='x', yLabel='y'}) {
  const pad=38, gw=w-pad*2, gh=h-pad*2;
  const px = x => pad + (x/xMax)*gw;
  const py = y => h - pad - (y/yMax)*gh;

  // Grid lines
  let grid='';
  for(let i=0;i<=xMax;i++) {
    const x=px(i);
    grid+=`<line x1="${x}" y1="${pad}" x2="${x}" y2="${h-pad}" stroke="rgba(0,255,255,.08)" stroke-width="1"/>`;
    if(i>0) grid+=`<text x="${x}" y="${h-pad+14}" text-anchor="middle" font-family="Share Tech Mono" font-size="10" fill="rgba(0,255,255,.5)">${i}</text>`;
  }
  for(let j=0;j<=yMax;j+=2) {
    const y=py(j);
    grid+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="rgba(0,255,255,.08)" stroke-width="1"/>`;
    if(j>0) grid+=`<text x="${pad-6}" y="${y+4}" text-anchor="end" font-family="Share Tech Mono" font-size="10" fill="rgba(0,255,255,.5)">${j}</text>`;
  }

  // Axes
  const axes=`
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad+6}" stroke="rgba(0,255,255,.7)" stroke-width="2"/>
    <line x1="${pad-6}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(0,255,255,.7)" stroke-width="2"/>
    <text x="${pad}" y="${pad-6}" text-anchor="middle" font-family="Share Tech Mono" font-size="10" fill="rgba(0,255,255,.7)">${yLabel}</text>
    <text x="${w-pad+10}" y="${h-pad+4}" text-anchor="start" font-family="Share Tech Mono" font-size="10" fill="rgba(0,255,255,.7)">${xLabel}</text>
    <text x="${pad-8}" y="${h-pad+4}" text-anchor="middle" font-family="Share Tech Mono" font-size="9" fill="rgba(0,255,255,.5)">0</text>`;

  // Line
  let linePath='';
  if(line!==null) {
    const x1=0, y1=line.m*x1+line.b, x2=xMax, y2=line.m*x2+line.b;
    if(y1>=0&&y1<=yMax&&y2>=0&&y2<=yMax)
      linePath=`<line x1="${px(x1)}" y1="${py(y1)}" x2="${px(x2)}" y2="${py(y2)}" stroke="${color}" stroke-width="2.5" opacity=".7"/>`;
    else {
      // clip to bounds
      linePath=`<line x1="${px(0)}" y1="${py(Math.max(0,line.b))}" x2="${px(xMax)}" y2="${py(Math.min(yMax,line.m*xMax+line.b))}" stroke="${color}" stroke-width="2.5" opacity=".7"/>`;
    }
  }

  // Points
  let dots='';
  points.forEach(([x,y],i)=>{
    dots+=`<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="${color}" opacity=".9"/>
           <text x="${px(x)+8}" y="${py(y)-6}" font-family="Share Tech Mono" font-size="9" fill="${color}">(${x},${y})</text>`;
  });

  // Label
  const lbl=label?`<text x="${w/2}" y="14" text-anchor="middle" font-family="Share Tech Mono" font-size="10" fill="${color}" opacity=".8">${label}</text>`:'';

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin:auto;background:rgba(0,0,8,.6);border:1px solid rgba(0,255,255,.2);">
    ${lbl}${grid}${axes}${linePath}${dots}
  </svg>`;
}

// Proportionality table helper
function tableHTML(headers, rows, color='#00FFFF') {
  return `<table style="border-collapse:collapse;font-family:'Share Tech Mono',monospace;font-size:15px;margin:0 auto;">
    <tr>${headers.map(h=>`<th style="border:1px solid ${color}44;padding:8px 18px;background:${color}18;color:${color};">${h}</th>`).join('')}</tr>
    ${rows.map(r=>`<tr>${r.map(c=>`<td style="border:1px solid ${color}22;padding:7px 18px;color:#E8E8FF;text-align:center;">${c}</td>`).join('')}</tr>`).join('')}
  </table>`;
}

// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════
const LV_COLORS = ['','#00FFFF','#AA00FF','#FF6600','#00FF88','#FF44AA'];
const LV_ICONS  = ['','⚔️','🧙','🏹','🛡️','👑'];
const LV_NAMES  = ['','NIVEL 1','NIVEL 2','NIVEL 3','NIVEL 4','NIVEL 5'];
const LV_LABELS = ['','Aprendiz','Explorador','Mago','Paladín','Héroe'];
const LV_ZONES  = ['','LA ALDEA','EL BOSQUE','LA MAZMORRA','EL CASTILLO','EL TRONO'];

const SLIDES = [
  { type:'cover' },
  { type:'story' },
  { type:'instructions' },

  // NIVEL 1 — Proporcionalidad directa
  { type:'sep', lv:1, xp:[],
    title:'NIVEL 1 — LA ALDEA',
    subtitle:'Proporcionalidad directa',
    desc:'El mercader de la aldea vende pociones. Cuantas más compres, más pagas. La razón siempre es constante.',
    formula:'y = k · x     (k = constante de proporcionalidad)' },
  { type:'q', lv:1, xp:[], eq:1, total:3,
    context:'Una poción cuesta <strong>5 monedas</strong>. ¿Cuánto cuestan 4 pociones?',
    question:'Calcula: y = 5 · x, con x = 4',
    visual: tableHTML(['Pociones (x)','Precio (y)'],[['1','5'],['2','10'],['3','15'],['4','?']]),
    eqRaw:'Una poción cuesta 5 monedas. ¿Cuánto cuestan 4 pociones? y es igual a 5 por x.',
    hint:'k = 5. Multiplica 5 × 4' },
  { type:'s', lv:1, xp:[], eq:1, total:3, solution:'y = 20 monedas', method:'y = 5 · 4 = 20 monedas' },

  { type:'q', lv:1, xp:[], eq:2, total:3,
    context:'Un guerrero recorre <strong>3 km por hora</strong>. ¿Cuánto tarda en recorrer 12 km?',
    question:'Calcula x (horas) si y = 3x y y = 12',
    visual: graphSVG({points:[[1,3],[2,6],[3,9],[4,12]],line:{m:3,b:0},xMax:5,yMax:15,label:'v = 3 km/h',xLabel:'h',yLabel:'km'}),
    eqRaw:'Un guerrero recorre 3 kilómetros por hora. ¿Cuántas horas necesita para recorrer 12 kilómetros?',

  { type:'s', lv:1, xp:[], eq:2, total:3, solution:'x = 4 horas', method:'12 = 3 · x → x = 12 ÷ 3 = 4 horas' },

  { type:'q', lv:1, xp:[], eq:3, total:3,
    context:'¿Cuál es la constante de proporcionalidad si x = 6 e y = 42?',
    question:'Calcula k en y = k · x',

      <div style="margin-top:20px;font-family:'Share Tech Mono',monospace;font-size:22px;color:#E8E8FF;">42 = k · 6</div>
      <div style="margin-top:10px;font-family:'Share Tech Mono',monospace;font-size:18px;color:#FFD700;">k = ?</div>
    </div>`,
    eqRaw:'¿Cuál es la constante de proporcionalidad si x vale 6 e y vale 42?',
    hint:'k = y ÷ x = 42 ÷ 6' },
  { type:'s', lv:1, xp:[], eq:3, total:3, solution:'k = 7', method:'k = 42 ÷ 6 = 7' },

  { type:'levelup', lv:2, xp:[1], cleared:1, next:2 },

  // NIVEL 2 — Tablas de valores
  { type:'sep', lv:2, xp:[1],
    title:'NIVEL 2 — EL BOSQUE',
    subtitle:'Tablas de valores de una función',
    desc:'Para atravesar el bosque encantado, debes completar las tablas mágicas. Cada función tiene su patrón.',
    formula:'f(x): para cada x, calcula y sustituyendo en la expresión' },
  { type:'q', lv:2, xp:[1], eq:1, total:3,
    context:'La función del hechicero es <strong>y = 2x + 1</strong>. Completa la tabla.',
    question:'Calcula y para x = 0, 1, 2, 3',
    visual: tableHTML(['x','y = 2x + 1'],[['0','?'],['1','?'],['2','?'],['3','?']],'#AA00FF'),
    eqRaw:'La función es y igual a 2 por x más 1. Calcula y para x igual a 0, 1, 2 y 3.',
    hint:'Sustituye: x=0 → 2·0+1=1; x=1 → 2·1+1=3...' },
  { type:'s', lv:2, xp:[1], eq:1, total:3,
    solution:'y = 1, 3, 5, 7',
    method:'x=0→1 | x=1→3 | x=2→5 | x=3→7',
    visual: tableHTML(['x','y = 2x + 1'],[['0','1'],['1','3'],['2','5'],['3','7']],'#00FF88') },

  { type:'q', lv:2, xp:[1], eq:2, total:3,
    context:'El dragón vuela con la función <strong>y = 3x</strong>. Completa su ruta.',
    question:'Calcula y para x = 1, 2, 3, 4',
    visual: tableHTML(['x (horas)','y = 3x (km)'],[['1','?'],['2','?'],['3','?'],['4','?']],'#AA00FF'),
    eqRaw:'La función del dragón es y igual a 3 por x. Calcula y para x igual a 1, 2, 3 y 4.',
    hint:'Multiplica cada x por 3' },
  { type:'s', lv:2, xp:[1], eq:2, total:3,
    solution:'y = 3, 6, 9, 12',
    method:'1→3 | 2→6 | 3→9 | 4→12',
    visual: tableHTML(['x (horas)','y = 3x (km)'],[['1','3'],['2','6'],['3','9'],['4','12']],'#00FF88') },

  { type:'q', lv:2, xp:[1], eq:3, total:3,
    context:'La función del mago es <strong>y = x + 4</strong>. Encuentra el valor perdido: cuando x = 8.',
    question:'Calcula y cuando x = 8 en y = x + 4',
    visual: tableHTML(['x','y = x + 4'],[['2','6'],['5','9'],['8','?']],'#AA00FF'),

function pixelBorder() {
  return `<div class="pixel-border"></div>`;
}
function tracker(activeLv, xpLvs=[]) {
  return `<div class="tracker">` +
    [1,2,3,4,5].map(l=>{
      const done  = xpLvs.includes(l);
      const active= activeLv===l;
      const cls   = done?'done':(active?'active':'');
      return `<div class="level-btn ${cls}">
        <div class="lv-num">${done?'✓':LV_ICONS[l]}</div>
        <div class="lv-label">${LV_LABELS[l]}</div>
      </div>`;
    }).join('') +
  `</div>`;
}
function lvBand(lv) {
  const c=LV_COLORS[lv];
  return `<div class="level-band" style="top:76px;color:${c};background:linear-gradient(90deg,transparent,${c}15,${c}28,${c}15,transparent);">
    ${LV_NAMES[lv]} &nbsp;·&nbsp; ${LV_ZONES[lv]}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════════════════
const stage=document.getElementById('stage');
let current=0, slideEls=[];

function getHTML(sl) {
  switch(sl.type){
    case'cover':        return renderCover();
    case'story':        return renderStory();
    case'instructions': return renderInstructions();
    case'sep':          return renderSep(sl);
    case'q':            return renderQuestion(sl);
    case's':            return renderSolution(sl);
    case'levelup':      return renderLevelUp(sl);
    case'victory':      return renderVictory();
    default: return '';
  }
}

function buildAll(){
  stage.innerHTML=''; slideEls=[];
  SLIDES.forEach(sl=>{ const el=document.createElement('div'); el.className='slide'; el.innerHTML=getHTML(sl); stage.appendChild(el); slideEls.push(el); });
}

function goTo(idx){
  if(idx<0||idx>=SLIDES.length) return;
  slideEls[current].classList.remove('active');
  current=idx; slideEls[current].classList.add('active');
  updateUI();
  setTimeout(()=>speak(getSpeechText(SLIDES[current])),300);
}

function updateUI(){
  document.getElementById('slide-counter').textContent=`${current+1} / ${SLIDES.length}`;
  document.getElementById('progress-line').style.width=((current+1)/SLIDES.length*100)+'%';
}

function scaleStage(){
  const scale=Math.min(window.innerWidth/1280,window.innerHeight/720);
  const ox=(window.innerWidth-1280*scale)/2, oy=(window.innerHeight-720*scale)/2;
  stage.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;
}

// ── TTS ──────────────────────────────────────────────────────
const synth=window.speechSynthesis;
let voiceMuted=false, heroVoice=null, speakRate=0.85;
function stripHTML(h){return h.replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/g,' ').replace(/\s+/g,' ').trim();}
function getSpeechText(sl){
  switch(sl.type){
    case'cover':        return 'Misión XP. Funciones y proporcionalidad para primero de la E.S.O. Pulsa start para comenzar.';
    case'story':        return 'El malvado Caos-X ha destruido todas las relaciones entre variables. Tú, aprendiz Sigma, debes resolver las 15 misiones para restaurar el orden matemático.';
    case'instructions': return 'Manual del héroe. Cinco niveles: proporcionalidad, tablas, gráficas, pendiente y la ecuación y igual a m por x más b. Calcula siempre antes de ver la solución para ganar XP.';
    case'sep': return `${sl.title}. ${stripHTML(sl.subtitle)}. ${stripHTML(sl.desc)}. Fórmula: ${sl.formula.replace(/·/g,' por ').replace(/=/g,' igual a ')}.`;
    case'q':  return `Misión ${sl.eq} de ${sl.total}. ${stripHTML(sl.context)}. ${sl.eqRaw}. Pista: ${sl.hint.replace(/→/g,' entonces ').replace(/·/g,' por ').replace(/÷/g,' entre ')}.`;
    case's':  return `Respuesta correcta. ${sl.solution}. Método: ${sl.method.replace(/·/g,' por ').replace(/÷/g,' entre ').replace(/=/g,' igual a ').replace(/→/g,' entonces ')}.`;
    case'levelup': return `¡Level up! ¡Nivel ${sl.cleared} completado! Quinientos puntos de experiencia ganados. ¡Avanzas al nivel ${sl.next}!`;
    case'victory': return '¡Misión completada! ¡Caos-X ha sido derrotado! El héroe Sigma ha restaurado el orden matemático del reino. Dos mil quinientos puntos de experiencia. Rango: Maestro de Funciones.';
    default: return '';
  }
}
function loadVoice(){
  const voices=synth.getVoices(); if(!voices.length) return;
  const pref=[v=>/google/i.test(v.name)&&/es/i.test(v.lang),v=>/es[-_]/i.test(v.lang),v=>/es/i.test(v.lang)];
  for(const t of pref){const m=voices.find(t); if(m){heroVoice=m; break;}}
}
synth.onvoiceschanged=loadVoice; loadVoice();
function speak(text){
  synth.cancel(); if(voiceMuted||!text) return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='es-ES'; utt.rate=speakRate; utt.pitch=0.6; utt.volume=1;
  if(heroVoice) utt.voice=heroVoice;
  const btn=document.getElementById('btn-voice'), bar=document.getElementById('speak-bar');
  btn.classList.add('speaking'); bar.style.display='block';
  utt.onend=utt.onerror=()=>{btn.classList.remove('speaking'); bar.style.display='none';};
  synth.speak(utt);
}
document.getElementById('btn-voice').addEventListener('click',e=>{
  e.stopPropagation(); voiceMuted=!voiceMuted;
  const btn=document.getElementById('btn-voice');
  if(voiceMuted){synth.cancel();btn.textContent='🔇';btn.classList.remove('speaking');btn.classList.add('muted');document.getElementById('speak-bar').style.display='none';}
  else{btn.textContent='🔊';btn.classList.remove('muted');speak(getSpeechText(SLIDES[current]));}
});
document.getElementById('voice-speed').addEventListener('change',e=>{e.stopPropagation();speakRate=parseFloat(e.target.value);if(!voiceMuted)speak(getSpeechText(SLIDES[current]));});

// ── MÚSICA 8-BIT (chiptune Web Audio API) ─────────────────────
let musicEnabled=false, musicAudio=null;
function bufToWav(buf,sr){
  const nCh=buf.numberOfChannels,len=buf.length*nCh*2+44,ab=new ArrayBuffer(len),v=new DataView(ab);
  let p=0;
  const u16=n=>{v.setUint16(p,n,true);p+=2;}, u32=n=>{v.setUint32(p,n,true);p+=4;}, s16=n=>{v.setInt16(p,Math.max(-32768,Math.min(32767,(n<0?n*32768:n*32767)|0)),true);p+=2;};
  u32(0x46464952);u32(len-8);u32(0x45564157);u32(0x20746d66);u32(16);u16(1);u16(nCh);u32(sr);u32(sr*nCh*2);u16(nCh*2);u16(16);u32(0x61746164);u32(len-p-4);
  const chs=Array.from({length:nCh},(_,i)=>buf.getChannelData(i));
  for(let i=0;i<buf.length;i++) for(let c=0;c<nCh;c++) s16(chs[c][i]);
  return new Blob([ab],{type:'audio/wav'});
}
function generate8bit(){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const sr=ctx.sampleRate, dur=28;
  const buf=ctx.createBuffer(2,sr*dur,sr);
  // C major pentatonic for "heroic" feel: C4 E4 G4 A4 C5
  const melody=[261.63,329.63,392,440,523.25,392,329.63,261.63,
                329.63,440,523.25,440,392,329.63,261.63,261.63];
  const bass  =[130.81,130.81,196,196, 164.81,164.81,196,196,
                130.81,130.81,196,196, 164.81,164.81,130.81,130.81];
  const beatDur=dur/melody.length;
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<d.length;i++){
      const t=i/sr;
      const beat=Math.floor(t/beatDur)%melody.length;
      const bT=(t%beatDur)/beatDur;
      // Square wave melody (chiptune)
      const mFreq=melody[beat];
      const mEnv=Math.exp(-bT*4)*Math.min(1,bT*60);
      const mSq=(Math.sin(2*Math.PI*mFreq*t)>0?1:-1)*mEnv*0.06;
      // Triangle bass
      const bFreq=bass[beat];
      const bTri=(2/Math.PI)*Math.asin(Math.sin(2*Math.PI*bFreq*t))*0.05;
      // Arp (high square octave)
      const arpFreq=mFreq*2;
      const arpBeat=Math.floor(t/(beatDur/4))%4;
      const arpEnv=arpBeat===0?Math.exp(-(t%(beatDur/4))/(beatDur/4)*6):0;
      const arp=(Math.sin(2*Math.PI*arpFreq*t)>0?1:-1)*arpEnv*0.025;
      // Noise snare every 2 beats
      const snareOn=(Math.floor(t/beatDur)%2===1&&bT<0.08);
      const snare=snareOn?(Math.random()-.5)*0.04:0;
      // Env
      const env=Math.min(1,Math.min(t*2,(dur-t)*2));
      d[i]=(mSq+bTri+arp+snare)*env*(ch===0?1:0.88);
    }
  }
  const blob=bufToWav(buf,sr);
  const audio=new Audio(URL.createObjectURL(blob));
  audio.loop=true; audio.volume=0.2; return audio;
}
document.getElementById('btn-music').addEventListener('click',e=>{
  e.stopPropagation(); musicEnabled=!musicEnabled;
  const btn=document.getElementById('btn-music');
  if(musicEnabled){
    if(!musicAudio) musicAudio=generate8bit();
    musicAudio.play().catch(()=>{});
    btn.textContent='🔊'; btn.style.color='var(--gold)';
  } else {
    if(musicAudio) musicAudio.pause();
    btn.textContent='🎵'; btn.style.color='';
  }
});

// ── CONTROLS ─────────────────────────────────────────────────
document.getElementById('btn-fs').addEventListener('click',e=>{e.stopPropagation();if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();});
document.getElementById('btnPrev').addEventListener('click',e=>{e.stopPropagation();goTo(current-1);});
document.getElementById('btnNext').addEventListener('click',e=>{e.stopPropagation();goTo(current+1);});
document.addEventListener('click',()=>goTo(current+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goTo(current+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();goTo(current-1);}
  if(e.key==='r'||e.key==='R') goTo(0);
  if(e.key==='m'||e.key==='M') document.getElementById('btn-voice').click();
  if(e.key==='n'||e.key==='N') document.getElementById('btn-music').click();
  if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
});
window.addEventListener('resize',scaleStage);
buildAll(); scaleStage(); goTo(0);
</script>
