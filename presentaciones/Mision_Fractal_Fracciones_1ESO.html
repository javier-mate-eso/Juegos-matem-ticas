<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión Fractal — Nave Orión VII</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:ital,wght@0,300;0,600;1,300&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --space:   #030812;
  --space2:  #060D1C;
  --space3:  #0A1628;
  --cyan:    #00E5FF;
  --cyan2:   #0097A7;
  --blue:    #1565C0;
  --neon:    #18FFFF;
  --green:   #00E676;
  --warn:    #FF9800;
  --danger:  #F44336;
  --white:   #E8F4FD;
  --muted:   #4A6FA5;
  --gold:    #FFD54F;
  --m1: #00E5FF;  /* Módulo 1 cyan    */
  --m2: #7C4DFF;  /* Módulo 2 purple  */
  --m3: #FF9800;  /* Módulo 3 orange  */
  --m4: #00E676;  /* Módulo 4 green   */
  --m5: #F44336;  /* Módulo 5 red     */
}

html, body { width:100%; height:100%; background:#000; overflow:hidden; cursor:pointer; }

/* ── STAGE ── */
#stage {
  position: absolute;
  width: 1280px; height: 720px;
  transform-origin: 0 0;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
}

/* ── STARFIELD ── */
#stars {
  position: absolute; inset: 0;
  background: var(--space);
  overflow: hidden;
}
#stars::before, #stars::after {
  content: '';
  position: absolute;
  width: 200%; height: 200%;
  top: -50%; left: -50%;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 70%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 35%, rgba(255,255,255,.9) 0%, transparent 100%),
    radial-gradient(2px 2px at 20% 80%, rgba(200,230,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 90% 90%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,.9) 0%, transparent 100%),
    radial-gradient(2px 2px at 78% 22%, rgba(180,220,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 88%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 58%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 5% 42%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 82%, rgba(255,255,255,.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 48% 30%, rgba(200,230,255,.8) 0%, transparent 100%),
    radial-gradient(2px 2px at 25% 10%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 82% 75%, rgba(255,255,255,.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 12% 92%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 58%, rgba(180,220,255,.8) 0%, transparent 100%);
  animation: drift 80s linear infinite;
}
#stars::after {
  background-image:
    radial-gradient(1px 1px at 22% 33%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 77% 44%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(2px 2px at 40% 72%, rgba(200,230,255,.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 95% 15%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 95%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 8% 68%, rgba(255,255,255,.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 72% 28%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(2px 2px at 33% 5%, rgba(180,220,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 88% 52%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 18% 78%, rgba(255,255,255,.9) 0%, transparent 100%);
  animation: drift 120s linear infinite reverse;
}
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(20px, 15px); } }

/* ── SCAN LINES ── */
.scan {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,.18) 3px, rgba(0,0,0,.18) 4px);
  pointer-events: none; z-index: 1;
}

/* ── HUD FRAME ── */
.hud-frame {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 5;
}
.hud-frame::before {
  content:'';
  position: absolute; inset: 10px;
  border: 1px solid rgba(0,229,255,.25);
}
/* Corner brackets */
.hud-frame::after {
  content:'';
  position: absolute;
  top: 10px; left: 10px;
  width: 40px; height: 40px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.hud-br, .hud-tr, .hud-bl {
  position: absolute;
  width: 40px; height: 40px;
  pointer-events: none; z-index: 6;
}
.hud-br { bottom:10px; right:10px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
.hud-tr { top:10px; right:10px;    border-top: 2px solid var(--cyan);   border-right: 2px solid var(--cyan); }
.hud-bl { bottom:10px; left:10px;  border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }

/* ── SLIDES ── */
.slide { position:absolute; inset:0; opacity:0; pointer-events:none; transition: opacity .4s ease; }
.slide.active { opacity:1; pointer-events:all; }

/* ── TRACKER / STATUS BAR ── */
.tracker {
  position: absolute;
  top: 0; left: 0; right: 0; height: 62px;
  background: rgba(3,8,18,.95);
  border-bottom: 1px solid rgba(0,229,255,.2);
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 0 16px; z-index: 10;
}
.mod-btn {
  width: 136px; height: 46px;
  border: 1px solid rgba(74,111,165,.5);
  background: rgba(6,13,28,.8);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: all .4s ease; border-radius: 3px;
  gap: 2px;
}
.mod-btn.active  { background: rgba(0,100,120,.5); border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.3); }
.mod-btn.done    { background: rgba(0,70,40,.6);  border-color: var(--green); }
.mod-label { font-size: 8px; letter-spacing: 2px; color: var(--muted); font-family:'Share Tech Mono',monospace; }
.mod-btn.active .mod-label,
.mod-btn.done   .mod-label { color: rgba(255,255,255,.7); }
.mod-num { font-size: 13px; font-weight: 700; color: var(--muted); }
.mod-btn.active .mod-num { color: var(--cyan); }
.mod-btn.done   .mod-num { color: var(--green); }

/* ── FRACTIONS ── */
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 4px;
  line-height: 1;
}
.frac .num { border-bottom: 3px solid currentColor; padding-bottom: 4px; line-height:1; }
.frac .den { padding-top: 4px; line-height:1; }

.frac-lg { font-size: 52px; }
.frac-lg .num, .frac-lg .den { min-width: 60px; text-align: center; }
.frac-lg .num { border-bottom-width: 4px; }

.frac-xl { font-size: 64px; }
.frac-xl .num, .frac-xl .den { min-width: 72px; text-align: center; }
.frac-xl .num { border-bottom-width: 5px; }

.frac-sm { font-size: 34px; }
.frac-sm .num, .frac-sm .den { min-width: 40px; text-align: center; }
.frac-sm .num { border-bottom-width: 3px; }

/* ── PANELS ── */
.hud-panel {
  background: rgba(6,13,28,.75);
  border: 1px solid rgba(0,229,255,.3);
  border-radius: 4px;
  position: relative;
}
.hud-panel::before {
  content: attr(data-label);
  position: absolute;
  top: -10px; left: 14px;
  background: var(--space2);
  color: var(--cyan2);
  font-size: 9px; letter-spacing: 3px;
  padding: 0 8px;
  font-family: 'Share Tech Mono', monospace;
}
.panel-green {
  background: rgba(0,50,30,.7);
  border: 1.5px solid var(--green);
  border-radius: 4px;
}
.panel-warn {
  background: rgba(50,25,0,.7);
  border: 1px solid rgba(255,152,0,.4);
  border-radius: 4px;
}
.panel-danger {
  background: rgba(50,5,5,.7);
  border: 1px solid rgba(244,67,54,.4);
  border-radius: 4px;
}

/* ── BADGES ── */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px 14px; border-radius: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
}
.badge-cyan  { background: rgba(0,100,130,.5); color: var(--cyan); border: 1px solid var(--cyan2); }
.badge-green { background: rgba(0,70,40,.6);  color: var(--green); border: 1px solid var(--green); }
.badge-warn  { background: rgba(80,40,0,.6);  color: var(--warn); border: 1px solid rgba(255,152,0,.5); }

/* ── TYPOGRAPHY ── */
.t-title { font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--cyan); text-shadow: 0 0 20px rgba(0,229,255,.5); }
.t-sub   { font-family: 'Exo 2', sans-serif; color: var(--white); }
.t-mono  { font-family: 'Share Tech Mono', monospace; }
.t-muted { color: var(--muted); }
.t-green { color: var(--green); text-shadow: 0 0 15px rgba(0,230,118,.5); }

/* ── MODULE BAND ── */
.mod-band {
  position: absolute; left: 28px; right: 28px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: 4px;
  font-family: 'Share Tech Mono', monospace;
}

/* ── ANIMATIONS ── */
@keyframes pulse-cyan {
  0%,100% { box-shadow: 0 0 15px rgba(0,229,255,.3); }
  50%      { box-shadow: 0 0 40px rgba(0,229,255,.7); }
}
@keyframes pulse-green {
  0%,100% { box-shadow: 0 0 15px rgba(0,230,118,.3); }
  50%      { box-shadow: 0 0 40px rgba(0,230,118,.7); }
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
@keyframes float-planet {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-12px) rotate(2deg); }
}
@keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes warp-in {
  from { opacity:0; transform: scale(.92); }
  to   { opacity:1; transform: scale(1); }
}
.slide.active { animation: warp-in .35s ease-out; }
.float-anim { animation: float-planet 3s ease-in-out infinite; }
.blink { animation: blink 1.2s ease-in-out infinite; }

/* ── NAV BAR ── */
#nav-bar {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: rgba(3,8,18,.92);
  border: 1px solid rgba(0,229,255,.3); border-radius: 20px;
  padding: 5px 14px; z-index: 9999;
  opacity: 0; transition: opacity .3s;
}
#nav-bar:hover, body:hover #nav-bar { opacity: 1; }
.nav-sep { width:1px; height:18px; background:rgba(0,229,255,.2); margin:0 2px; }
#btn-voice.speaking { color: var(--green); text-shadow: 0 0 8px rgba(0,230,118,.8); }
#btn-voice.muted    { color: var(--danger); opacity:.7; }
#voice-speed {
  background: none; border: 1px solid rgba(0,229,255,.25); border-radius: 10px;
  color: var(--muted); font-size: 9px; font-family:'Share Tech Mono',monospace;
  padding: 2px 6px; cursor: pointer; outline: none;
}
#voice-speed:hover { border-color: var(--cyan); color: var(--cyan); }
#voice-speed option { background: #060D1C; }
#speak-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--cyan2), var(--cyan), var(--cyan2));
  background-size: 200% 100%;
  animation: speak-wave 1s linear infinite;
  z-index: 9997; display: none;
}
@keyframes speak-wave {
  from { background-position: 0% 0%; }
  to   { background-position: 200% 0%; }
}
.nav-btn {
  background: none; border: none; cursor: pointer;
  color: var(--cyan); font-size: 16px; padding: 4px 8px;
  font-family: 'Share Tech Mono', monospace;
  transition: color .2s;
}
.nav-btn:hover { color: var(--neon); }
#slide-counter { color: var(--muted); font-size: 10px; font-family:'Share Tech Mono',monospace; min-width:60px; text-align:center; }
#progress-line {
  position: fixed; bottom:0; left:0; height:2px;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
  transition: width .4s ease; z-index: 9998;
}

/* ── CLICK HINT ── */
#click-hint {
  position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
  font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted);
  z-index: 6;
}

/* ── OXYGEN BAR ── */
.oxy-bar-track {
  height: 8px; border-radius: 4px;
  background: rgba(0,229,255,.15);
  border: 1px solid rgba(0,229,255,.2);
  overflow: hidden;
}
.oxy-bar-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--cyan2), var(--cyan));
  box-shadow: 0 0 8px rgba(0,229,255,.5);
}

/* ── PLANET SVG ── */
.planet-ring { fill: none; stroke: rgba(0,229,255,.4); stroke-width: 4; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="speak-bar"></div>

<div id="nav-bar">
  <button class="nav-btn" id="btnPrev">◀</button>
  <span id="slide-counter">1 / 1</span>
  <button class="nav-btn" id="btnNext">▶</button>
  <div class="nav-sep"></div>
  <button class="nav-btn" id="btn-voice" title="Voz ARIA (M para silenciar)">🔊</button>
  <select id="voice-speed" title="Velocidad de voz">
    <option value="0.7">LENTO</option>
    <option value="0.85" selected>NORMAL</option>
    <option value="1.1">RÁPIDO</option>
  </select>
  <div class="nav-sep"></div>
  <button class="nav-btn" id="btn-fs" title="Pantalla completa">⛶</button>
</div>
<div id="progress-line"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════

const MOD_COLORS  = ['','#00E5FF','#7C4DFF','#FF9800','#00E676','#F44336'];
const MOD_NAMES   = ['','NIVEL 1','NIVEL 2','NIVEL 3','NIVEL 4','NIVEL 5'];
const MOD_ROMAN   = ['','I','II','III','IV','V'];
const MOD_LABELS  = ['','Cadete','Piloto','Ingeniero','Comandante','Almirante'];
const MOD_MODULES = ['','MÓDULO ALPHA','MÓDULO BETA','MÓDULO GAMMA','MÓDULO DELTA','MÓDULO OMEGA'];

// Helper para renderizar fracciones en HTML
function F(num, den, size='lg') {
  return `<span class="frac frac-${size}"><span class="num">${num}</span><span class="den">${den}</span></span>`;
}

// Equations como HTML (pueden incluir fracciones)
const SLIDES = [
  { type:'cover' },
  { type:'narrative' },
  { type:'instructions' },

  // MÓDULO I — Fracciones equivalentes y simplificación
  { type:'sep', mod:1, done:[],
    title:'MÓDULO ALPHA', subtitle:'Fracciones equivalentes', tipo:'SISTEMA: Equivalencia y simplificación',
    alert:'⚠ ALERTA: Fuga en depósito de combustible. Calibra los sensores.', color:'#00E5FF' },

  { type:'q', mod:1, done:[], eq:1, total:3,
    context:'El sensor de oxígeno marca <strong>6/8</strong> de capacidad. El manual pide la fracción simplificada.',
    equation: F(6,8,'xl'),
    hint:'Divide numerador y denominador entre 2', eqRaw:'6/8' },
  { type:'s', mod:1, done:[], eq:1, total:3, equation: F(6,8,'sm'),
    solution: F(3,4,'xl'), solutionText:'Divide num. y den. entre 2 → 3/4' },

  { type:'q', mod:1, done:[], eq:2, total:3,
    context:'¿Es <strong>2/3</strong> equivalente a <strong>8/12</strong>? El sistema de soporte vital necesita confirmarlo.',
    equation: `${F(2,3,'xl')} ≡ ${F(8,12,'xl')} ?`,
    hint:'Simplifica 8/12 ÷ 4', eqRaw:'2/3 ≡ 8/12' },
  { type:'s', mod:1, done:[], eq:2, total:3, equation: `${F(2,3,'sm')} ≡ ${F(8,12,'sm')}`,
    solution:`<span style="font-size:54px;font-family:'Orbitron';color:var(--green);">✓ SÍ</span>`,
    solutionText:'8÷4 = 2 y 12÷4 = 3 → ambas son 2/3' },

  { type:'q', mod:1, done:[], eq:3, total:3,
    context:'Completa la proporción para calibrar el motor de impulso: <strong>1/4 = ?/12</strong>',
    equation: `${F(1,4,'xl')} = ${F('?',12,'xl')}`,
    hint:'Multiplica numerador y denominador de 1/4 por 3', eqRaw:'1/4 = ?/12' },
  { type:'s', mod:1, done:[], eq:3, total:3, equation: `${F(1,4,'sm')} = ${F('?',12,'sm')}`,
    solution:`${F(3,12,'xl')}`, solutionText:'1×3=3 y 4×3=12 → el numerador es 3' },

  { type:'door', mod:2, done:[1], cleared:1, next:2 },

  // MÓDULO II — Comparar y ordenar fracciones
  { type:'sep', mod:2, done:[1],
    title:'MÓDULO BETA', subtitle:'Comparar y ordenar', tipo:'SISTEMA: Comparación de fracciones',
    alert:'⚠ ALERTA: Conflicto en el reparto de raciones. Calcula prioridades.', color:'#7C4DFF' },

  { type:'q', mod:2, done:[1], eq:1, total:3,
    context:'Dos tripulantes piden raciones. ¿Cuál es la fracción mayor? El comandante necesita decidir.',
    equation: `${F(3,5,'xl')} &nbsp;vs&nbsp; ${F(4,7,'xl')}`,
    hint:'Denominador común = 35. Compara 21/35 y 20/35', eqRaw:'3/5 vs 4/7' },
  { type:'s', mod:2, done:[1], eq:1, total:3, equation:`${F(3,5,'sm')} vs ${F(4,7,'sm')}`,
    solution:`<span style="font-size:52px;">${F(3,5,'xl')}<span style="color:var(--green);"> &gt; </span>${F(4,7,'xl')}</span>`,
    solutionText:'21/35 > 20/35 → 3/5 es mayor' },

  { type:'q', mod:2, done:[1], eq:2, total:3,
    context:'Ordena estos depósitos de agua de menor a mayor para distribuirlos correctamente.',
    equation: `${F(1,2,'xl')} &ensp; ${F(1,3,'xl')} &ensp; ${F(1,4,'xl')}`,
    hint:'Mismo numerador: mayor denominador → fracción más pequeña', eqRaw:'1/2, 1/3, 1/4' },
  { type:'s', mod:2, done:[1], eq:2, total:3, equation:`${F(1,2,'sm')} , ${F(1,3,'sm')} , ${F(1,4,'sm')}`,
    solution:`<span style="font-size:38px;">${F(1,4,'sm')} &lt; ${F(1,3,'sm')} &lt; ${F(1,2,'sm')}</span>`,
    solutionText:'A mayor denominador (con num=1), menor fracción' },

  { type:'q', mod:2, done:[1], eq:3, total:3,
    context:'El depósito de agua está al <strong>5/8</strong> de su capacidad. ¿Cuánto falta para llenarlo?',
    equation: `1 - ${F(5,8,'xl')} = ?`,
    hint:'1 = 8/8. Resta: 8/8 − 5/8', eqRaw:'1 - 5/8' },
  { type:'s', mod:2, done:[1], eq:3, total:3, equation:`1 − ${F(5,8,'sm')}`,
    solution:`${F(3,8,'xl')}`, solutionText:'8/8 − 5/8 = 3/8' },

  { type:'door', mod:3, done:[1,2], cleared:2, next:3 },

  // MÓDULO III — Suma y resta mismo denominador
  { type:'sep', mod:3, done:[1,2],
    title:'MÓDULO GAMMA', subtitle:'Suma y resta (mismo denominador)', tipo:'SISTEMA: Operaciones básicas',
    alert:'⚠ ALERTA: Fusionar tanques de oxígeno. Calcula volúmenes totales.', color:'#FF9800' },

  { type:'q', mod:3, done:[1,2], eq:1, total:3,
    context:'Dos tanques de oxígeno aportan sus reservas. ¿Cuánto hay en total?',
    equation: `${F(2,7,'xl')} + ${F(3,7,'xl')} = ?`,
    hint:'Mismo denominador: suma los numeradores y conserva el denominador', eqRaw:'2/7 + 3/7' },
  { type:'s', mod:3, done:[1,2], eq:1, total:3, equation:`${F(2,7,'sm')} + ${F(3,7,'sm')}`,
    solution:`${F(5,7,'xl')}`, solutionText:'2+3=5, denominador sigue siendo 7' },

  { type:'q', mod:3, done:[1,2], eq:2, total:3,
    context:'De una reserva de <strong>9/10</strong> de combustible se consumen <strong>3/10</strong> en el salto hiperespacial.',
    equation: `${F(9,10,'xl')} - ${F(3,10,'xl')} = ?`,
    hint:'Mismo denominador: resta numeradores y simplifica si puedes', eqRaw:'9/10 - 3/10' },
  { type:'s', mod:3, done:[1,2], eq:2, total:3, equation:`${F(9,10,'sm')} − ${F(3,10,'sm')}`,
    solution:`${F(6,10,'xl')} = ${F(3,5,'xl')}`, solutionText:'9−3=6 → 6/10 → simplifica ÷2 → 3/5' },

  { type:'q', mod:3, done:[1,2], eq:3, total:3,
    context:'Tres mini-depósitos de alimentos se combinan. ¿Cuánto hay en total?',

// RENDER HELPERS
// ═══════════════════════════════════════════════════════════════

function hudCorners() {
  return `<div class="hud-frame"></div>
          <div class="hud-br"></div><div class="hud-tr"></div><div class="hud-bl"></div>`;
}

function scanlines() {
  return `<div class="scan"></div>`;
}

function tracker(activeMod, doneMods=[]) {
  return `<div class="tracker">` +
    [1,2,3,4,5].map(m => {
      const done   = doneMods.includes(m);
      const active = activeMod === m;
      const cls    = done ? 'done' : (active ? 'active' : '');
      return `<div class="mod-btn ${cls}">
        <div class="mod-num">${done ? '✓' : MOD_ROMAN[m]}</div>
        <div class="mod-label">${MOD_LABELS[m]}</div>
      </div>`;
    }).join('') +
  `</div>`;
}

function modBand(mod) {
  const c = MOD_COLORS[mod];
  return `<div class="mod-band" style="top:78px;background:linear-gradient(90deg,transparent,${c}25,${c}40,${c}25,transparent);border-top:1px solid ${c}30;border-bottom:1px solid ${c}30;color:${c};">
    ${MOD_MODULES[mod]} &nbsp;·&nbsp; ${MOD_LABELS[mod].toUpperCase()}
  </div>`;
}

function planet(cx, cy, r, color, rings=true) {
  const rid = 'r'+Math.random().toString(36).slice(2,6);
  return `<svg style="position:absolute;left:${cx-r-40}px;top:${cy-r-40}px;width:${(r+40)*2}px;height:${(r+40)*2}px;overflow:visible;pointer-events:none;z-index:0;" viewBox="${-r-40} ${-r-40} ${(r+40)*2} ${(r+40)*2}">
    <defs>
      <radialGradient id="${rid}" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="${color}" stop-opacity=".5"/>
        <stop offset="100%" stop-color="${color}" stop-opacity=".08"/>
      </radialGradient>
    </defs>
    ${rings ? `<ellipse cx="0" cy="0" rx="${r*1.7}" ry="${r*.35}" fill="none" stroke="${color}" stroke-opacity=".25" stroke-width="6"/>` : ''}
    <circle cx="0" cy="0" r="${r}" fill="url(#${rid})" stroke="${color}" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="${-r*.2}" cy="${-r*.25}" r="${r*.12}" fill="${color}" opacity=".12"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════════════════

const stage = document.getElementById('stage');
let current = 0;
let slideEls = [];

// ── TTS ENGINE ────────────────────────────────────────────────
const synth    = window.speechSynthesis;
let voiceMuted = false;
let ariaVoice  = null;
let speakRate  = 0.85;

// Strip HTML tags to plain text
function stripHTML(html) {
  return html
    .replace(/<[^>]*>/g,'')
    .replace(/&ensp;|&nbsp;/g,' ')
    .replace(/&gt;/g,'>')
    .replace(/&lt;/g,'<')
    .replace(/&amp;/g,'&')
    .replace(/\s+/g,' ')
    .trim();
}

// Build speech text per slide type
function getSpeechText(sl) {
  switch(sl.type) {
    case 'cover':
      return 'Misión Fractal. Racionamiento de recursos en la nave Orión Siete. Ecuaciones de fracciones para primero de la E.S.O. Haz clic para comenzar la misión.';
    case 'narrative':
      return 'Mensaje de la Inteligencia Artificial ARIA. Tripulación de la Orión Siete. Detectamos una avería crítica en los sistemas de distribución de recursos. Los depósitos de oxígeno, agua, combustible y alimentos están desincronizados. Para restablecer el suministro, debéis resolver quince ecuaciones de fracciones distribuidas en cinco módulos de la nave. Cada módulo desbloqueará el siguiente compartimento. Sin vuestros cálculos, la misión fracasará.';
    case 'instructions':
      return 'Protocolo de misión. Cinco módulos con tres ecuaciones cada uno. La dificultad aumenta progresivamente. Primero aparece la ecuación. Intenta resolverla antes de ver la solución. Resuelve los tres ejercicios de un módulo para desbloquear el siguiente compartimento.';
    case 'sep':
      return `${sl.title}. ${sl.subtitle}. ${sl.tipo.replace('TIPO:','Tipo:').replace('SISTEMA:','Sistema:')}. ${stripHTML(sl.alert.replace('⚠','').replace('⚠⚠',''))}`;
    case 'q': {
      const ctx  = stripHTML(sl.context);
      const hint = sl.hint;
      return `Ecuación ${sl.eq} de ${sl.total}. ${ctx}. La expresión es: ${sl.eqRaw}. Pista: ${hint}. Haz clic para ver la solución.`;
    }
    case 's': {
      const sol = stripHTML(sl.solution);
      return `Solución verificada. ${sl.solutionText.replace(/→/g, 'entonces').replace(/÷/g,'dividido entre').replace(/×/g,'por')}. Respuesta: ${sol}.`;
    }
    case 'door':
      return `Compartimento desbloqueado. Módulo ${sl.cleared} completado. ¡Excelente trabajo, tripulación! Accediendo al módulo ${sl.next}, ${MOD_MODULES[sl.next]}.`;
    case 'victory':
      return 'Misión cumplida. Nave Orión Siete salvada. Habéis resuelto las quince ecuaciones de fracciones y restablecido todos los sistemas de la nave. La tripulación ha sobrevivido gracias a vuestra maestría matemática. Mensaje de ARIA: Tripulación excepcional. Sus cálculos han sido perfectos. La nave Orión Siete regresa a casa.';
    default: return '';
  }
}

// Load best Spanish voice — robotic preference
function loadVoice() {
  const voices = synth.getVoices();
  if (!voices.length) return;

  // Priority: Google español > Microsoft español > any español > any
  const pref = [
    v => /google/i.test(v.name) && /es[-_]/i.test(v.lang),
    v => /microsoft/i.test(v.name) && /es[-_]/i.test(v.lang),
    v => /es[-_]/i.test(v.lang),
    v => /es/i.test(v.lang),
  ];
  for (const test of pref) {
    const match = voices.find(test);
    if (match) { ariaVoice = match; break; }
  }
}

synth.onvoiceschanged = loadVoice;
loadVoice();

function speak(text) {
  synth.cancel();
  if (voiceMuted || !text) return;
  const utt          = new SpeechSynthesisUtterance(text);
  utt.lang           = 'es-ES';
  utt.rate           = speakRate;
  utt.pitch          = 0.55;   // Low pitch → robotic
  utt.volume         = 1;
  if (ariaVoice) utt.voice = ariaVoice;

  // UI feedback
  const btn  = document.getElementById('btn-voice');
  const bar  = document.getElementById('speak-bar');
  btn.classList.add('speaking');
  bar.style.display = 'block';

  utt.onend = utt.onerror = () => {
    btn.classList.remove('speaking');
    bar.style.display = 'none';
  };
  synth.speak(utt);
}

// Voice button
document.getElementById('btn-voice').addEventListener('click', e => {
  e.stopPropagation();
  voiceMuted = !voiceMuted;
  const btn = document.getElementById('btn-voice');
  const bar = document.getElementById('speak-bar');
  if (voiceMuted) {
    synth.cancel();
    btn.textContent = '🔇';
    btn.classList.remove('speaking');
    btn.classList.add('muted');
    bar.style.display = 'none';
  } else {
    btn.textContent = '🔊';
    btn.classList.remove('muted');
    speak(getSpeechText(SLIDES[current]));
  }
});

// Speed selector
document.getElementById('voice-speed').addEventListener('change', e => {
  e.stopPropagation();
  speakRate = parseFloat(e.target.value);
  if (!voiceMuted) speak(getSpeechText(SLIDES[current]));
});

// ── SLIDES ───────────────────────────────────────────────────

function getHTML(sl) {
  switch(sl.type) {
    case 'cover':        return renderCover();
    case 'narrative':    return renderNarrative();
    case 'instructions': return renderInstructions();
    case 'sep':          return renderSep(sl);
    case 'q':            return renderQuestion(sl);
    case 's':            return renderSolution(sl);
    case 'door':         return renderDoor(sl);
    case 'victory':      return renderVictory();
    default:             return '';
  }
}

function buildAll() {
  stage.innerHTML = '';
  slideEls = [];
  SLIDES.forEach((sl, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = getHTML(sl);
    stage.appendChild(el);
    slideEls.push(el);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  updateUI();
  // Delay speech slightly so slide transition is visible first
  setTimeout(() => speak(getSpeechText(SLIDES[current])), 300);
}

function updateUI() {
  const total = SLIDES.length;
  document.getElementById('slide-counter').textContent = `${current+1} / ${total}`;
  document.getElementById('progress-line').style.width = ((current+1)/total*100) + '%';
}

function scaleStage() {
  const scale = Math.min(window.innerWidth/1280, window.innerHeight/720);
  const ox = (window.innerWidth  - 1280*scale)/2;
  const oy = (window.innerHeight - 720 *scale)/2;
  stage.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
}

document.getElementById('btn-fs').addEventListener('click', e => {
  e.stopPropagation();
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
document.getElementById('btnPrev').addEventListener('click', e => { e.stopPropagation(); goTo(current-1); });
document.getElementById('btnNext').addEventListener('click', e => { e.stopPropagation(); goTo(current+1); });
document.addEventListener('click', () => goTo(current+1));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); goTo(current+1); }
  if (e.key==='ArrowLeft')                { e.preventDefault(); goTo(current-1); }
  if (e.key==='r'||e.key==='R')           { goTo(0); }
  if (e.key==='m'||e.key==='M')           { document.getElementById('btn-voice').click(); }
  if (e.key==='f'||e.key==='F')           {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
window.addEventListener('resize', scaleStage);

buildAll();
scaleStage();
goTo(0);
</script>
