<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>El Caso del Dado Trucado — Inspector Sigma</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --noir:    #1A1410;
  --sepia:   #2B231D;
  --brown:   #3D2F26;
  --tan:     #8B7355;
  --amber:   #D4A574;
  --gold:    #F4D03F;
  --cream:   #F5E6D3;
  --green:   #7FB069;
  --red:     #C0392B;
  --blue:    #34495E;
  --c1: #D4A574; /* Caso 1 */
  --c2: #7FB069; /* Caso 2 */
  --c3: #E74C3C; /* Caso 3 */
  --c4: #9B59B6; /* Caso 4 */
  --c5: #3498DB; /* Caso 5 */
}

html, body { width:100%; height:100%; background:#0A0805; overflow:hidden; cursor:pointer; }

#stage {
  position: absolute; width: 1280px; height: 720px;
  transform-origin: 0 0; overflow: hidden;
  font-family: 'Courier Prime', monospace;
}

/* ── NOIR FOG ── */
.fog {
  position: absolute; inset: 0;
  background: 
    radial-gradient(ellipse at 20% 30%, rgba(42,35,29,.3) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(42,35,29,.25) 0%, transparent 50%),
    linear-gradient(180deg, rgba(26,20,16,.95) 0%, rgba(26,20,16,.7) 100%);
  pointer-events: none;
}

/* ── PAPER TEXTURE ── */
.paper-bg {
  position: absolute; inset: 0;
  background: var(--sepia);
  background-image: 
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
}

/* ── SLIDES ── */
.slide { position:absolute; inset:0; opacity:0; pointer-events:none; transition: opacity .5s ease; }
.slide.active { opacity:1; pointer-events:all; }

/* ── SPOTLIGHT ── */
.spotlight {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(244,208,63,.15) 0%, transparent 70%);
  pointer-events: none;
  animation: spot-drift 8s ease-in-out infinite;
}
@keyframes spot-drift {
  0%, 100% { transform: translate(-50px, -30px); }
  50%       { transform: translate(50px, 30px); }
}

/* ── TYPEWRITER BORDER ── */
.case-border {
  position: absolute; inset: 20px;
  border: 3px double var(--tan);
  pointer-events: none; z-index: 2;
}
.case-border::before, .case-border::after {
  content: '◆';
  position: absolute;
  color: var(--amber);
  font-size: 18px;
}
.case-border::before { top: -12px; left: 20px; }
.case-border::after  { bottom: -12px; right: 20px; }

/* ── EVIDENCE TRACKER ── */
.tracker {
  position: absolute; top: 0; left: 0; right: 0; height: 68px;
  background: linear-gradient(180deg, rgba(26,20,16,.98) 0%, rgba(26,20,16,.85) 100%);
  border-bottom: 2px solid rgba(212,165,116,.3);
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 0 20px; z-index: 10;
}
.case-btn {
  width: 140px; height: 50px;
  border: 2px solid rgba(139,115,85,.4);
  background: rgba(43,35,29,.6);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: all .4s ease; position: relative;
  box-shadow: inset 0 0 20px rgba(0,0,0,.3);
}
.case-btn::before {
  content: '📋';
  position: absolute;
  top: -8px; right: -8px;
  font-size: 16px;
  opacity: 0;
  transition: opacity .3s;
}
.case-btn.active  { background: rgba(212,165,116,.25); border-color: var(--amber); box-shadow: 0 0 15px rgba(244,208,63,.3); }
.case-btn.solved  { background: rgba(127,176,105,.2); border-color: var(--green); }
.case-btn.solved::before { opacity: 1; }
.case-num { font-size: 11px; color: var(--tan); font-family: 'Special Elite', cursive; }
.case-btn.active .case-num,
.case-btn.solved .case-num { color: var(--cream); }
.case-label { font-size: 9px; color: var(--tan); letter-spacing: 1px; margin-top: 2px; }

/* ── DOSSIER PANELS ── */
.dossier {
  background: rgba(43,35,29,.85);
  border: 2px solid rgba(139,115,85,.5);
  box-shadow: 5px 5px 20px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.2);
  position: relative;
}
.dossier::before {
  content: 'CONFIDENCIAL';
  position: absolute;
  top: -12px; left: 20px;
  background: var(--sepia);
  color: var(--amber);
  font-size: 8px; letter-spacing: 3px;
  padding: 0 10px;
  font-family: 'Special Elite', cursive;
  border: 1px solid var(--tan);
}
.evidence-tag {
  background: var(--brown);
  border: 1px solid var(--tan);
  padding: 4px 12px;
  font-size: 10px;
  color: var(--amber);
  font-family: 'Special Elite', cursive;
  letter-spacing: 2px;
  display: inline-block;
  box-shadow: 2px 2px 8px rgba(0,0,0,.4);
}
.solved-stamp {
  background: rgba(127,176,105,.2);
  border: 2px solid var(--green);
  color: var(--green);
}

/* ── TYPOGRAPHY ── */
.t-case   { font-family: 'Special Elite', cursive; color: var(--amber); text-shadow: 2px 2px 4px rgba(0,0,0,.7); }
.t-body   { font-family: 'Courier Prime', monospace; color: var(--cream); line-height: 1.6; }
.t-fancy  { font-family: 'Playfair Display', serif; color: var(--gold); font-style: italic; }
.t-data   { font-family: 'Courier Prime', monospace; font-weight: 700; color: var(--amber); }
.t-green  { color: var(--green); text-shadow: 0 0 10px rgba(127,176,105,.5); }

/* ── ANIMATIONS ── */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50%       { opacity: .85; }
}
@keyframes typewriter {
  from { width: 0; }
  to   { width: 100%; }
}
.fade-in { animation: fade-in .6s ease-out; }
@keyframes fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── NAV BAR ── */
#nav-bar {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: rgba(26,20,16,.95);
  border: 2px solid rgba(139,115,85,.4); padding: 6px 16px;
  z-index: 9999; opacity: 0; transition: opacity .3s;
  box-shadow: 0 4px 20px rgba(0,0,0,.8);
}
#nav-bar:hover, body:hover #nav-bar { opacity: 1; }
.nav-btn {
  background: none; border: none; cursor: pointer;
  color: var(--amber); font-size: 16px; padding: 4px 8px;
  font-family: 'Courier Prime', monospace;
  transition: color .2s;
}
.nav-btn:hover { color: var(--gold); }
#slide-counter { color: var(--tan); font-size: 11px; font-family:'Courier Prime',monospace; min-width:70px; text-align:center; }
#progress-line {
  position: fixed; bottom:0; left:0; height:3px;
  background: linear-gradient(90deg, var(--brown), var(--amber));
  transition: width .4s ease; z-index: 9998;
}

#click-hint {
  position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
  font-family: 'Courier Prime', monospace; font-size: 12px; color: var(--tan);
  font-style: italic; z-index: 6;
}

/* ── TABLE STYLING ── */
.stat-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'Courier Prime', monospace;
  font-size: 14px;
}
.stat-table th {
  background: rgba(139,115,85,.3);
  border: 1px solid var(--tan);
  padding: 8px 12px;
  color: var(--amber);
  text-align: center;
  font-weight: 700;
}
.stat-table td {
  border: 1px solid rgba(139,115,85,.3);
  padding: 8px 12px;
  color: var(--cream);
  text-align: center;
}
.stat-table tr:nth-child(even) { background: rgba(0,0,0,.15); }
</style>
</head>
<body>

<!-- AUDIO EMBEBIDO (generado al final) -->
<audio id="bgMusic" loop></audio>

<div id="stage"></div>

<div id="nav-bar">
  <button class="nav-btn" id="btnPrev">◄</button>
  <span id="slide-counter">1 / 1</span>
  <button class="nav-btn" id="btnNext">►</button>
  <button class="nav-btn" id="btn-music" title="Música (M)">🎵</button>
  <button class="nav-btn" id="btn-fs" title="Pantalla completa">⛶</button>
</div>
<div id="progress-line"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA

const CASE_COLORS = ['','#D4A574','#7FB069','#E74C3C','#9B59B6','#3498DB'];
const CASE_NAMES  = ['','CASO I','CASO II','CASO III','CASO IV','CASO V'];

const SLIDES = [

// HELPERS
// ═══════════════════════════════════════════════════════════════

function fog() { return `<div class="fog"></div>`; }
function caseBorder() { return `<div class="case-border"></div>`; }
function spotlight(x, y) {
  return `<div class="spotlight" style="left:${x}px;top:${y}px;"></div>`;
}

function tracker(activeCaso, solvedCasos=[]) {
  return `<div class="tracker">` +
    [1,2,3,4,5].map(c => {
      const solved = solvedCasos.includes(c);
      const active = activeCaso === c;
      const cls = solved ? 'solved' : (active ? 'active' : '');
      return `<div class="case-btn ${cls}">
        <div class="case-num">${CASE_NAMES[c]}</div>
        <div class="case-label">${CASE_LABELS[c]}</div>
      </div>`;
    }).join('') +
  `</div>`;
}

const stage = document.getElementById('stage');
let current = 0;
let slideEls = [];

function getHTML(sl) {
  switch(sl.type) {
    case 'cover':        return renderCover();
    case 'briefing':     return renderBriefing();
    case 'instructions': return renderInstructions();
    case 'sep':          return renderSep(sl);
    case 'q':            return renderQuestion(sl);
    case 's':            return renderSolution(sl);
    case 'solved':       return renderSolved(sl);
    case 'victory':      return renderVictory();
    default:             return '';
  }
}

function buildAll() {
  stage.innerHTML = '';
  slideEls = [];
  SLIDES.forEach((sl, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = getHTML(sl);
    stage.appendChild(el);
    slideEls.push(el);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  updateUI();
}

function updateUI() {
  document.getElementById('slide-counter').textContent = `${current+1} / ${SLIDES.length}`;
  document.getElementById('progress-line').style.width = ((current+1)/SLIDES.length*100) + '%';
}

function scaleStage() {
  const scale = Math.min(window.innerWidth/1280, window.innerHeight/720);
  const ox = (window.innerWidth  - 1280*scale)/2;
  const oy = (window.innerHeight - 720 *scale)/2;
  stage.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
}

// ── AUDIO GENERATION ────────────────────────────────────────────
// Generate noir jazz ambient using Web Audio API
function generateNoirMusic() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const duration = 30; // 30 seconds loop
  const sampleRate = audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(2, sampleRate * duration, sampleRate);
  
  for (let channel = 0; channel < 2; channel++) {
    const data = buffer.getChannelData(channel);
    
    // Bass drone (low rumble)
    for (let i = 0; i < data.length; i++) {
      const t = i / sampleRate;
      const bass = Math.sin(2 * Math.PI * 55 * t) * 0.08; // A1 note
      const bass2 = Math.sin(2 * Math.PI * 82.41 * t) * 0.06; // E2 note
      
      // Slow pad (mystery vibe)
      const pad = Math.sin(2 * Math.PI * 220 * t * (1 + 0.02 * Math.sin(t * 0.5))) * 0.03;
      
      // Vinyl crackle (noise)
      const noise = (Math.random() - 0.5) * 0.01;
      
      // Envelope (fade in/out for loop)
      const env = Math.min(1, Math.min(t * 2, (duration - t) * 2));
      
      data[i] = (bass + bass2 + pad + noise) * env;
    }
  }
  
  // Convert to WAV and set as source
  const audioBlob = bufferToWave(buffer, sampleRate);
  const audioUrl = URL.createObjectURL(audioBlob);
  document.getElementById('bgMusic').src = audioUrl;
}

function bufferToWave(abuffer, sampleRate) {
  const numOfChan = abuffer.numberOfChannels;
  const length = abuffer.length * numOfChan * 2 + 44;
  const buffer = new ArrayBuffer(length);
  const view = new DataView(buffer);
  const channels = [];
  let offset = 0;
  let pos = 0;

  // write WAVE header
  setUint32(0x46464952); // "RIFF"
  setUint32(length - 8); // file length - 8
  setUint32(0x45564157); // "WAVE"
  
  setUint32(0x20746d66); // "fmt " chunk
  setUint32(16);         // length = 16
  setUint16(1);          // PCM (uncompressed)
  setUint16(numOfChan);
  setUint32(sampleRate);
  setUint32(sampleRate * 2 * numOfChan); // avg. bytes/sec
  setUint16(numOfChan * 2);              // block-align
  setUint16(16);         // 16-bit

  setUint32(0x61746164); // "data" - chunk
  setUint32(length - pos - 4); // chunk length

  // write interleaved data
  for (let i = 0; i < abuffer.numberOfChannels; i++)
    channels.push(abuffer.getChannelData(i));

  while (pos < length) {
    for (let i = 0; i < numOfChan; i++) {
      let sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
      view.setInt16(pos, sample, true);
      pos += 2;
    }
    offset++;
  }

  return new Blob([buffer], { type: 'audio/wav' });

  function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
  function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
}

// Music controls
let musicEnabled = false;
const audio = document.getElementById('bgMusic');
audio.volume = 0.25; // Quiet background

document.getElementById('btn-music').addEventListener('click', e => {
  e.stopPropagation();
  musicEnabled = !musicEnabled;
  const btn = document.getElementById('btn-music');
  
  if (musicEnabled) {
    if (!audio.src) generateNoirMusic();
    audio.play().catch(() => {});
    btn.textContent = '🔊';
    btn.style.color = 'var(--green)';
  } else {
    audio.pause();
    btn.textContent = '🔇';
    btn.style.color = 'var(--tan)';
  }
});

document.getElementById('btn-fs').addEventListener('click', e => {
  e.stopPropagation();
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.getElementById('btnPrev').addEventListener('click', e => { e.stopPropagation(); goTo(current-1); });
document.getElementById('btnNext').addEventListener('click', e => { e.stopPropagation(); goTo(current+1); });
document.addEventListener('click', () => goTo(current+1));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); goTo(current+1); }
  if (e.key==='ArrowLeft')                { e.preventDefault(); goTo(current-1); }
  if (e.key==='r'||e.key==='R')           { goTo(0); }
  if (e.key==='m'||e.key==='M')           { document.getElementById('btn-music').click(); }
  if (e.key==='f'||e.key==='F')           {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

window.addEventListener('resize', scaleStage);

buildAll();
scaleStage();
goTo(0);
</script>
